name: Build & Package Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 📦 Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: 🏷️ Organize Artifacts
        run: |
          mkdir -p build-artifacts
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/CalcExchange-Debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/CalcExchange-Release.apk
          fi
          echo "### 🚀 빌드 완료 안내" >> $GITHUB_STEP_SUMMARY
          echo "스마트 계산기 & 외화 환전 안드로이드 앱 빌드가 성공적으로 완료되었습니다!" >> $GITHUB_STEP_SUMMARY
          echo "- **패키지명**: \`com.mmlab2010.calc\`" >> $GITHUB_STEP_SUMMARY
          echo "- **생성된 아티팩트**: \`CalcExchange-Debug-APK\`, \`CalcExchange-Release-APK\`" >> $GITHUB_STEP_SUMMARY
          echo "화면 하단 Artifacts 섹션에서 APK 파일을 바로 다운로드하여 스마트폰에 설치할 수 있습니다." >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalcExchange-Debug-APK
          path: build-artifacts/CalcExchange-Debug.apk
          retention-days: 30

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalcExchange-Release-APK
          path: build-artifacts/CalcExchange-Release.apk
          retention-days: 30

      - name: 🌟 Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
