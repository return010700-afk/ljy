name: Build & Package Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Organize Artifacts
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/CalcExchange-Debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/CalcExchange-Release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CalcExchange-Debug-APK
          path: build-artifacts/CalcExchange-Debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CalcExchange-Release-APK
          path: build-artifacts/CalcExchange-Release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
